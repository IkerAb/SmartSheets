services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Sales Analytics & Forecasting API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-sales_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-sales_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sales_pass}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sales_user:sales_pass@db:5432/sales_analytics}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: sales-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-sales_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sales_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sales_user} -d ${POSTGRES_DB:-sales_analytics}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
